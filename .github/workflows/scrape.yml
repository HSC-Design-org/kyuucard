name: Scrape weekly fuel prices

on:
  schedule:
    # 毎日 15:23 JST = 06:23 UTC
    # 経産省の公表は原則水曜14時JST（祝日週は木曜等にズレる）ため、
    # 毎日チェックして公表当日に取得する。変更がない日は commit しない。
    # 00分台はGitHubの混雑で数時間遅延するため 23分を指定。
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run scraper
        run: node scrape.js

      - name: Commit data.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain data.json)" ]]; then
            git add data.json
            git commit -m "data: weekly update ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          else
            echo "No changes in data.json"
          fi
