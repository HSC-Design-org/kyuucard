name: Scrape weekly fuel prices

on:
  schedule:
    # 毎週 水・木・金・土 15:53 JST = 06:53 UTC
    # 経産省の公表は原則水曜14時JST → 水曜夕方に取得。
    # 祝日週は公表が木曜以降にズレるため木曜も実行。
    # さらに金・土を保険に入れてある（2026-08-19追加）。理由＝水木が両方失敗すると
    # その週の更新が丸ごと飛ぶため。一時的な失敗なら金土で自動的に取り返せる。
    # 変更がない日は commit しない（＝余分な実行をしても履歴は汚れない）。
    # 00分台はGitHubの混雑を避けて53分を指定。
    - cron: '53 6 * * 3,4,5,6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run scraper
        run: node scrape.js

      - name: Commit data.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain data.json)" ]]; then
            git add data.json
            git commit -m "data: weekly update ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          else
            echo "No changes in data.json"
            # GitHub は「60日間コミットが無い公開リポジトリ」のスケジュール実行を自動停止する。
            # スクレイプが失敗し続けると data.json のコミットも止まり、静かに無効化されて
            # 修正しても動かない状態になる（2026-08-19に49日まで到達し、あと11日だった）。
            # そこで30日以上コミットが無ければハートビートだけ打って、停止を確実に防ぐ。
            LAST_COMMIT_TS=$(git log -1 --format=%ct)
            AGE_DAYS=$(( ( $(date -u +%s) - LAST_COMMIT_TS ) / 86400 ))
            echo "last commit age: ${AGE_DAYS}d"
            if [ "$AGE_DAYS" -ge 30 ]; then
              date -u '+%Y-%m-%d %H:%M UTC' > .github/last-heartbeat
              git add .github/last-heartbeat
              git commit -m "chore: keep scheduled workflow alive (no data change for ${AGE_DAYS}d)"
              git push
            fi
          fi

      # 失敗したときだけ Slack に通知する（成功時は何も送らない）。
      # 2026-08-19追加。理由＝取得が7週間止まってもエラーが誰にも届かず、
      # サイトが6月のデータを表示し続けたことに気づけなかったため。
      # チャンネルIDは secrets.SLACK_CHANNEL_ID。未設定なら黙ってスキップする。
      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          if [ -z "$SLACK_BOT_TOKEN" ] || [ -z "$SLACK_CHANNEL_ID" ]; then
            echo "Slack secrets not set; skipping notification"
            exit 0
          fi
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          TEXT=":rotating_light: 給油価格ランキングの自動取得に失敗しました（kyuucard.net /rank/）— 直さないとサイトの価格表示が古いまま止まります。ログ: ${RUN_URL}"
          BODY=$(jq -n --arg c "$SLACK_CHANNEL_ID" --arg t "$TEXT" '{channel:$c,text:$t}')
          curl -sS -X POST https://slack.com/api/chat.postMessage -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" -H "Content-type: application/json; charset=utf-8" --data "$BODY" > slack_res.json
          jq -r 'if .ok then "slack: sent" else "slack: FAILED " + (.error // "unknown") end' slack_res.json
          rm -f slack_res.json
