name: Scrape weekly fuel prices

on:
  schedule:
    # 毎週 水・木 15:53 JST = 06:53 UTC
    # 経産省の公表は原則水曜14時JST → 水曜夕方に取得。
    # 祝日週は公表が木曜以降にズレるため、木曜夕方にもう1回（保険）。
    # 変更がない日は commit しない。00分台はGitHubの混雑を避けて53分を指定。
    - cron: '53 6 * * 3,4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run scraper
        run: node scrape.js

      - name: Commit data.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain data.json)" ]]; then
            git add data.json
            git commit -m "data: weekly update ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          else
            echo "No changes in data.json"
          fi
